; Configuration PlatformIO — https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = /dev/cu.usbserial-*
upload_speed = 460800
monitor_port = /dev/cu.usbserial-*
monitor_speed = 115200

lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
build_src_filter = +<*> -<diag/>

; Diagnostic de l'écran : pio run -e diag -t upload -t monitor
[env:diag]
extends = env:esp32dev
build_src_filter = +<diag/>
